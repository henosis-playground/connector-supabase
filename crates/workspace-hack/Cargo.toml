[package]
name = "workspace-hack"
version = "0.0.0"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "workspace-hack package, managed by hakari"

### BEGIN HAKARI SECTION
[dependencies]
axum = { version = "0.8", features = ["http2"] }
axum-core = { version = "0.5", default-features = false, features = [
  "tracing",
] }
bytes = { version = "1", features = ["serde"] }
futures-channel = { version = "0.3", features = ["sink"] }
futures-task = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", features = ["channel", "io", "sink"] }
hyper-util = { version = "0.1", features = [
  "client-legacy",
  "server-auto",
  "server-graceful",
  "service",
] }
log = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["alloc", "derive"] }
serde_core = { version = "1", features = ["alloc"] }
serde_json = { version = "1", features = ["alloc", "raw_value"] }
sync_wrapper = { version = "1", default-features = false, features = [
  "futures",
] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "parking_lot",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
tower = { version = "0.5", default-features = false, features = [
  "buffer",
  "log",
  "make",
  "util",
] }
tracing = { version = "0.1", features = ["log"] }
tracing-core = { version = "0.1" }

[build-dependencies]
proc-macro2 = { version = "1" }
quote = { version = "1" }
serde = { version = "1", features = ["alloc", "derive"] }
serde_core = { version = "1", features = ["alloc"] }
syn = { version = "2", features = [
  "extra-traits",
  "fold",
  "full",
  "visit",
  "visit-mut",
] }

[target.x86_64-unknown-linux-gnu.dependencies]
bitflags = { version = "2", default-features = false, features = ["std"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "aws-lc-rs",
  "http1",
  "http2",
  "native-tokio",
  "ring",
  "tls12",
  "webpki-tokio",
] }
hyper-util = { version = "0.1", default-features = false, features = [
  "client-proxy",
] }
rustls = { version = "0.23", default-features = false, features = [
  "aws-lc-rs",
  "aws_lc_rs",
  "logging",
  "ring",
  "std",
  "tls12",
] }
rustls-webpki = { version = "0.103", default-features = false, features = [
  "aws-lc-rs",
  "ring",
  "std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
tower = { version = "0.5", default-features = false, features = [
  "retry",
  "timeout",
] }
tower-http = { version = "0.6", features = ["catch-panic", "follow-redirect"] }

